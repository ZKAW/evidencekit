[project]
name = "evidencekit"
version = "0.1.0"
description = "Compliance-as-code evidence collector for ISO 27001 and HDS controls on AWS and GitHub"
readme = "README.md"
authors = [
    { name = "ZKAW", email = "zkaw.exod@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.44.3",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
    "typer>=0.29.1",
]

[project.scripts]
evidencekit = "evidencekit.cli:app"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "moto[cloudtrail,iam,s3,server]>=5.2.5",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
